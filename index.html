<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Snake</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #183a35, #090d15 65%); color: #dfffea; }
    main { width: min(92vw, 520px); text-align: center; }
    h1 { margin: 8px 0 16px; color: #70ff8f; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 0 18px #35ef68; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .score { font-weight: 800; font-size: 1.15rem; }
    button { border: 1px solid #70ff8f88; border-radius: 10px; background: #15251f; color: #dfffea; padding: 9px 13px; font-weight: 800; cursor: pointer; }
    canvas { width: 100%; aspect-ratio: 1; display: block; background: #080d12; border: 3px solid #70ff8f; border-radius: 14px; box-shadow: 0 0 35px #34cc6355; image-rendering: pixelated; }
  </style>
</head>
<body>
  <main>
    <h1>Neon Snake</h1>
    <div class="top">
      <div class="score">Punkte: <span id="score">0</span></div>
      <button id="restart" type="button">Neu starten</button>
    </div>
    <canvas id="game" width="480" height="480" tabindex="0" aria-label="Snake-Spiel. Steuerung mit den vier Pfeiltasten."></canvas>
  </main>
  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const size = 20;
    const cells = canvas.width / size;
    let snake, food, direction, nextDirection, score, timer, running;

    function reset() {
      snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}];
      direction = {x: 1, y: 0};
      nextDirection = {x: 1, y: 0};
      score = 0; scoreEl.textContent = 0;
      running = true;
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, 110);
      canvas.focus();
    }

    function placeFood() {
      do {
        food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
      } while (snake.some(p => p.x === food.x && p.y === food.y));
    }

    function setDirection(name) {
      const dirs = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
      const next = dirs[name];
      if (next && next.x !== -direction.x && next.y !== -direction.y) nextDirection = next;
    }

    function tick() {
      if (!running) return;
      direction = nextDirection;
      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
      if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells || snake.some(p => p.x === head.x && p.y === head.y)) {
        running = false; clearInterval(timer); draw(); return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++; scoreEl.textContent = score; placeFood();
      } else snake.pop();
      draw();
    }

    function draw() {
      ctx.fillStyle = '#080d12'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#142319'; ctx.lineWidth = 1;
      for (let i = 0; i <= cells; i++) {
        ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size); ctx.stroke();
      }
      ctx.shadowColor = '#ff4f79'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff4f79'; ctx.beginPath(); ctx.arc(food.x * size + size/2, food.y * size + size/2, 7, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = '#70ff8f'; ctx.shadowBlur = 10;
      snake.forEach((p, i) => { ctx.fillStyle = i === 0 ? '#caff78' : '#55df78'; ctx.fillRect(p.x * size + 2, p.y * size + 2, size - 4, size - 4); });
      ctx.shadowBlur = 0;
      if (!running) {
        ctx.fillStyle = '#090d15cc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '800 38px system-ui'; ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 12);
        ctx.fillStyle = '#70ff8f'; ctx.font = '700 18px system-ui'; ctx.fillText(`${score} Punkte`, canvas.width/2, canvas.height/2 + 24);
      }
    }

    const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    window.addEventListener('keydown', e => {
      const directionName = keyMap[e.key];
      if (directionName) {
        e.preventDefault();
        setDirection(directionName);
      }
    });

    document.querySelector('#restart').addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
